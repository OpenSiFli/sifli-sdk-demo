CONFIG_LXT_DISABLE=y
CONFIG_BSP_USING_GPIO=y
CONFIG_BSP_USING_PINMUX=y
CONFIG_BSP_USING_DMA=y
CONFIG_BSP_USING_UART=y
CONFIG_BSP_USING_UART1=y
CONFIG_BSP_UART1_RX_USING_DMA=y
CONFIG_BSP_USING_ONCHIP_RTC=y
CONFIG_BSP_USING_LCPU_PATCH=y
CONFIG_RT_USING_MTD_NOR=y

# 1 MB in-package (SiP) NOR on MPI2 (0x12000000), no PSRAM.
CONFIG_BSP_ENABLE_MPI2=y
CONFIG_BSP_QSPI2_MEM_SIZE=1

# I2S1 slave input for the relay.
CONFIG_BSP_USING_I2S=y
CONFIG_BSP_ENABLE_I2S1=y
CONFIG_BSP_ENABLE_AUD_PRC=y
CONFIG_BSP_AUDPRC_TX0_DMA=y
CONFIG_BSP_AUDPRC_RX0_DMA=y
CONFIG_BSP_ENABLE_AUD_CODEC=y
