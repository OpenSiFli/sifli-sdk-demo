# SF32LB57Z relay configuration.
CONFIG_LXT_DISABLE=y
CONFIG_BSP_ENABLE_I2S1=y
CONFIG_AUDIO_RX_USING_I2S=y
CONFIG_BSP_USING_LCPU_PATCH=y

# The local music source and its filesystem are used by the 52B build.
# CONFIG_AUDIO_LOCAL_MUSIC is not set
# CONFIG_RT_USING_DFS_ELMFAT is not set

# BR/BLE use 17 dBm and EDR uses 13 dBm in app_rf_power.c.
CONFIG_BT_TX_POWER_VAL=y
CONFIG_BT_TX_POWER_VAL_MAX=17
CONFIG_BT_TX_POWER_VAL_MIN=0
CONFIG_BT_TX_POWER_VAL_INIT=17

# Use warning-level logging while streaming audio.
CONFIG_ULOG_OUTPUT_LVL_W=y
