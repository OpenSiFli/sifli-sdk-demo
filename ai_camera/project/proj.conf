CONFIG_BSP_USING_ADC1=y
# 相机框架的 DCMI 后端独占外设，必须关闭 SDK 的 DCMI 设备驱动
# CONFIG_BSP_USING_DCMI is not set
CONFIG_BSP_QSPI3_MEM_SIZE=8
CONFIG_BSP_USING_PWMT1=y
CONFIG_BSP_USING_PWMT2=y
CONFIG_BSP_USING_I2C=y
CONFIG_BSP_USING_I2C1=y
CONFIG_CAMERA_FRAMEWORK_ENABLE=y
CONFIG_SENSOR_USING_OV2640=y
CONFIG_CAMERA_OV2640_INTERFACE_DVP=y
CONFIG_CAMERA_DVP_BACKEND_DCMI=y
# CONFIG_CAMERA_DCMI_PCLK_FALLING is not set
CONFIG_CAMERA_XCLK_PIN=2
CONFIG_CAMERA_SCCB_I2C_BUS_NAME="i2c1"
CONFIG_CAMERA_SCCB_SCL_PIN=23
CONFIG_CAMERA_SCCB_SDA_PIN=22
CONFIG_CAMERA_SCCB_MAX_HZ=100000
CONFIG_CAMERA_ISP_HARDWARE=y
# CONFIG_CAMERA_SW_JPEG is not set
CONFIG_LCD_USING_HTM_H070A20_RGB_A01=y
# CONFIG_LCD_USING_TFT_CO5300 is not set
# CONFIG_BSP_USING_TOUCHD is not set
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_BLUETOOTH=y
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_TCPTHREAD_MBOX_SIZE=48
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_USING_WEBSOCKET=y
CONFIG_LWIP_ALTCP=y
CONFIG_LWIP_ALTCP_TLS=y
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_ULOG_USING_FILTER=y
CONFIG_LEARNING_CAMERA_UI_LOG=n
CONFIG_LEARNING_CAMERA_FPS_LOG=n
# 断言时打印寄存器/栈信息而不是静默挂住，方便定位运行时挂死
CONFIG_BSP_USING_FULL_ASSERT=y
# 与可用例程一致的控制台接收缓冲，避免重载日志时丢输出
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_USING_MEMHEAP=y
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
CONFIG_BLUETOOTH=y
CONFIG_BT_FINSH=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_PAN=y
CONFIG_CFG_HID=y
CONFIG_BT_AUTO_CONNECT_LAST_DEVICE=y
CONFIG_USING_BUTTON_LIB=y
CONFIG_PKG_USING_CJSON=y
CONFIG_PKG_USING_FLASHDB=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
# CONFIG_LV_USING_EXT_RESOURCE_MANAGER is not set
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LCD_FB_USING_NONE=y
CONFIG_LV_FB_TWO_SCREEN_SIZE=y
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_PKG_USING_MBEDTLS_USE_ALL_CERTS=y
CONFIG_PKG_USING_MBEDTLS_USER_CERTS=y
CONFIG_PKG_LIB_OPUS=y
CONFIG_PKG_USING_WEBCLIENT=y
