CONFIG_BSP_USING_FULL_ASSERT=y
# CONFIG_RT_USING_FINSH is not set
CONFIG_PKG_USING_CHERRYUSB=y
CONFIG_PKG_CHERRYUSB_DEVICE=y
CONFIG_PKG_CHERRYUSB_DEVICE_MUSB_SIFLI=y
CONFIG_PKG_CHERRYUSB_DEVICE_HID=y
CONFIG_PKG_CHERRYUSB_DEVICE_SPEED_HS=y
CONFIG_PKG_USING_CHERRYUSB_LATEST_VERSION=y

# Keep the device reference firmware free of unrelated periodic peripherals.
CONFIG_BSP_USING_LCD=n
CONFIG_LCD_USING_TFT_H080A11HDIFT4C30_V0_1=n
CONFIG_BSP_USING_TOUCHD=n
CONFIG_BSP_ENABLE_AUD_PRC=n
CONFIG_BSP_AUDPRC_TX0_DMA=n
CONFIG_BSP_AUDPRC_RX0_DMA=n
CONFIG_BSP_ENABLE_AUD_CODEC=n
CONFIG_BSP_USING_PWM=n
CONFIG_BSP_USING_PWMT2=n
CONFIG_BSP_USING_GPTIM2=n
CONFIG_BSP_USING_GPTIM3=n
CONFIG_BSP_USING_BTIM1=n
