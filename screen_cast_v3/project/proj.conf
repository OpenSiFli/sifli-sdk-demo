CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_RT_MAIN_THREAD_STACK_SIZE=8192
CONFIG_RT_USING_MEMHEAP=y
CONFIG_BLUETOOTH=y
CONFIG_BSP_BLE_SERIAL_TRANSMISSION=y
CONFIG_PROTO_V3=y
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_USING_SCREEN_CAST=y
CONFIG_BT_CON_NUM_CUSTOMIZE=y
CONFIG_CFG_MAX_BT_ACL_NUM=2
CONFIG_PKG_USING_FLASHDB=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y

# --- LVGL v8 ---
CONFIG_LVGL_V8=y

CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LCD_FB_USING_TWO_UNCOMPRESSED=y
CONFIG_LV_FB_TWO_NOT_SCREEN_SIZE=y
CONFIG_LV_FB_LINE_NUM=200
CONFIG_DRV_EPIC_NEW_API=y
CONFIG_DRV_EPIC_NEW_API_SINGLE_CORE=y

# --- FreeType (tiny) font engine ---
CONFIG_LV_USING_FREETYPE_ENGINE=y
CONFIG_FREETYPE_TINY_FONT=y

CONFIG_FREETYPE_TINY_FONT_LITE=y
# CONFIG_FREETYPE_TINY_FONT_FULL is not set
CONFIG_FREETYPE_CACHE_IN_PSRAM=y
CONFIG_FT_CACHE_SIZE=200000

CONFIG_LV_USE_EZIP=y
CONFIG_LV_USE_QRCODE=y

# --- JPEG decoding of the cast frames ---
# USING_JPEG_DEC routes the decode to the SoC JPEG engine; LV_USE_SJPG and
# LVSF_USING_SJPG are its LVGL integration for LV_IMG_CF_JPG images.
CONFIG_USING_JPEG_DEC=y
CONFIG_LV_USE_SJPG=y
CONFIG_LVSF_USING_SJPG=y

# One decoded image at a time (a decoded frame is 832x480x4 bytes large).
CONFIG_LV_IMG_CACHE_DEF_SIZE=1

CONFIG_IMAGE_CACHE_IN_PSRAM_SIZE=6000000


CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_36=y

CONFIG_LV_FONT_FMT_TXT_LARGE=y

# CONFIG_LV_USING_EXT_RESOURCE_MANAGER is not set
CONFIG_PKG_USING_CJSON=y

# wifi相关配置，使用爱科微8800D40L模块

# CONFIG_USING_SCREEN_CAST_WIFI=y 
# CONFIG_USING_SCREEN_CAST_WIFI_AP=y
# CONFIG_AIC_WLAN_AIC8800D40L=y
# CONFIG_AIC_WIRELESS_PWR_GPIO=85


CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
CONFIG_RT_SDIO_THREAD_PRIORITY=9

CONFIG_RT_USING_WIFI=y
CONFIG_RT_WLAN_DEBUG=y
CONFIG_RT_WLAN_CMD_DEBUG=y

CONFIG_RT_USING_SYSTEM_WORKQUEUE=y
CONFIG_RT_USING_PTHREADS=y

CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_USING_NETDEV=y
CONFIG_RT_LWIP_PBUF_NUM=60
CONFIG_RT_LWIP_TCP_SND_BUF=8192
CONFIG_RT_LWIP_TCP_WND=32768
CONFIG_RT_LWIP_TCP_SEG_NUM=80
CONFIG_RT_LWIP_TCP_PCB_NUM=8
CONFIG_RT_LWIP_UDP_PCB_NUM=8
CONFIG_RT_LWIP_RAW_PCB_NUM=8
CONFIG_RT_MEMP_NUM_NETCONN=16
CONFIG_RT_LWIP_TCPTHREAD_PRIORITY=3
CONFIG_RT_LWIP_TCPTHREAD_MBOX_SIZE=32
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_ETHTHREAD_MBOX_SIZE=32
CONFIG_RT_LWIP_NETIF_LOOPBACK=y

# 手机加入 P2P GO 后由设备做 DHCP 服务端 (手机将拿到 192.168.88.2)
CONFIG_LWIP_USING_DHCPD=y
CONFIG_DHCPD_SERVER_IP="192.168.88.1"
